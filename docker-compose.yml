services:
  restaurant:
    build:
      context: ./services/restaurant
    container_name: a1-restaurant
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  order:
    build:
      context: ./services/order
    container_name: a1-order
    ports:
      - "8080:8080"
    environment:
      RESTAURANT_URL: "http://restaurant:8081"
      RESTAURANT_TIMEOUT_SECONDS: "2"
    depends_on:
      restaurant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
